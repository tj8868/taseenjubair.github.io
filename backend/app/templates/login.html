<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Sign in · Portfolio CMS</title>
    <link rel="stylesheet" href="/back/static/admin.css" />
  </head>
  <body class="centered">
    <form method="post" action="/back/login" class="card login-card">
      <h1>Portfolio CMS</h1>
      <p class="sub">Sign in to manage your site content.</p>

      {% if error %}<p class="notice bad">{{ error }}</p>{% endif %}

      <input type="hidden" name="csrf" value="{{ csrf }}" />

      <label for="username">Username</label>
      <input id="username" name="username" autocomplete="username" required autofocus />

      <label for="password">Password</label>
      <input
        id="password"
        name="password"
        type="password"
        autocomplete="current-password"
        required
      />

      <button type="submit" class="btn primary wide">Sign in</button>
    </form>
  </body>
</html>
